name: CI

on:
  push:
    branches:
      - master
      - feat/research-blackboard-mvp
  pull_request:

jobs:
  test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # The committed lockfile still comes from the upstream fork and is not yet
      # synchronized with all Research Blackboard dependencies. Use npm install
      # until a regenerated lockfile is committed, then switch this to npm ci.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run regression tests
        run: npm test

      - name: Build extension
        run: npm run build
